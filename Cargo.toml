[package]
name = "image-optimizer"
version = "0.2.3"
edition = "2021"
license = "MIT"
description = "Portable GUI that optimizes images with jpegoptim, pngcrush, and cwebp"
publish = false

[dependencies]
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }

[target.'cfg(target_os = "windows")'.dependencies]
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = { version = "0.15", default-features = false }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
