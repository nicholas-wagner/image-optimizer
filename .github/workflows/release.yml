name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl python3 zlib1g-dev
      - name: Build jpegoptim, pngcrush, and cwebp
        run: ./scripts/build-tools.sh
      - name: Build the app
        run: cargo build --release
      - name: Pack the binary
        run: |
          mkdir -p dist
          cp target/release/image-optimizer dist/image-optimizer-linux-x86_64
          chmod +x dist/image-optimizer-linux-x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/image-optimizer-linux-x86_64

  windows:
    name: Windows x86_64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Cross-compile the exe
        run: bash scripts/build-windows-inner.sh
      - name: Pack the binary
        run: |
          mkdir -p dist
          cp target/x86_64-pc-windows-gnu/release/image-optimizer.exe dist/image-optimizer-windows-x86_64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/image-optimizer-windows-x86_64.exe

  publish:
    name: Publish GitHub release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -l dist
          tag="${GITHUB_REF_NAME}"
          notes=$(mktemp)
          sed "s/RELEASE_TAG/${tag}/g" LICENSES/release-offer.txt > "$notes"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" --clobber \
              dist/image-optimizer-linux-x86_64 \
              dist/image-optimizer-windows-x86_64.exe
          else
            gh release create "$tag" \
              --title "$tag" \
              --generate-notes \
              --notes "$(cat "$notes")" \
              dist/image-optimizer-linux-x86_64 \
              dist/image-optimizer-windows-x86_64.exe
          fi
