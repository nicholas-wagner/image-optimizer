name: Test

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: fmt and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl python3 zlib1g-dev
      - name: Build jpegoptim, pngcrush, and cwebp
        run: ./scripts/build-tools.sh
      - name: Check formatting
        run: cargo fmt --check
      - name: Test
        run: cargo test
      # Warnings already exist in the tree, so this does not fail the job.
      - name: Clippy
        run: cargo clippy --all-targets
